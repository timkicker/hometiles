name: Release

# A tag, and only a tag. F-Droid reads tags to find new versions (UpdateCheckMode: Tags),
# so the tag is the release; this workflow only puts a file beside it.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # The tag has to agree with the versionName in the build file. A release named
      # v0.2.0 carrying 0.1.0 inside is the kind of mismatch nobody notices until an
      # update refuses to install.
      - name: The tag and versionName must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "tag $tag, versionName $name"
          test "$tag" = "$name"

      # A release is the loudest moment there is. Nothing personal goes out with it, and
      # the history is checked too, not only today's tree.
      - name: Look for personal data
        run: tools/opsec.py

      # Every release has run the rules. A build that ships without them shipped nothing
      # that was checked.
      - name: Run the rules
        run: ./gradlew test

      - name: Build (unsigned)
        run: ./gradlew --no-build-cache clean assembleRelease

      # No apk is attached, on purpose. `assembleRelease` builds without a signing key,
      # and android refuses an archive without a signature - measured on 06.09.2026:
      # `INSTALL_PARSE_FAILED_NO_CERTIFICATES`. A file nobody can install has no business on
      # a release page. HomeTiles is shipped through F-Droid, which builds from this source
      # and signs with its own key; the build above stays as a check that the tag builds at
      # all.
      - name: The checksum of what F-Droid will build
        run: |
          cd app/build/outputs/apk/release
          sha256sum app-release-unsigned.apk

      - name: Draft the release
        uses: softprops/action-gh-release@v2
        with:
          name: HomeTiles ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          # A draft, not a publication: somebody reads it before the world does.
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## HomeTiles ${{ github.ref_name }}

            Install it from **F-Droid**. F-Droid builds this tag from source and signs it
            with its own key, so nothing here has to be trusted on our word.

            There is deliberately no apk on this page: a build without a signing key cannot
            be installed, and a file nobody can install would only be in the way.

            The same source gives the same file - see "Reproducible builds" in the README if
            you want to check that F-Droid built what is written here.
